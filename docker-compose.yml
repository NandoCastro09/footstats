version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: footstats_postgres
    environment:
      POSTGRES_USER: footstats
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: footstats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footstats"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: footstats_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: