# Mantém a API do Render acordada.
# No plano grátis, o Render desliga o serviço depois de 15 min sem acesso, e a próxima
# visita espera de 30 a 50 s. Este workflow acessa o /health a cada 10 min para evitar isso.
# Um serviço ligado o mês todo usa ~744 h, dentro das 750 h grátis do Render.
name: Manter API acordada

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Acessar /health
        env:
          API_URL: ${{ vars.API_URL || 'https://footstats-api.onrender.com' }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 \
            "$API_URL/health"
